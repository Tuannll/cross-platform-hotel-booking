name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowayhome
          POSTGRES_PASSWORD: nowayhome
          POSTGRES_DB: nowayhome_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nowayhome:nowayhome@127.0.0.1:5433/nowayhome_test?schema=public
      TEST_DATABASE_URL: postgresql://nowayhome:nowayhome@127.0.0.1:5433/nowayhome_test?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_for_testing_only_32_chars
      JWT_REFRESH_SECRET: ci_refresh_secret_for_testing_only_32_chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      DEMO_PAYMENTS_ENABLED: true
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate --schema prisma/schema.prisma

      - name: Run Backend & Web checks
        run: pnpm run check

      - name: Run PostgreSQL E2E Tests
        run: |
          pnpm --filter backend run test:e2e:prepare
          pnpm --filter backend run test:e2e

      - name: Install Mobile dependencies
        run: npm install --prefix mobile-app --ignore-scripts

      - name: Lint Mobile App
        run: npm run lint --prefix mobile-app

      - name: Typecheck Mobile App
        run: npm run typecheck --prefix mobile-app
