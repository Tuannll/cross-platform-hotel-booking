name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nowayhome
          POSTGRES_PASSWORD: nowayhome
          POSTGRES_DB: nowayhome_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter backend exec prisma generate --schema prisma/schema.prisma
      - run: pnpm run check
      - name: Run PostgreSQL E2E Tests
        env:
          TEST_DATABASE_URL: postgresql://nowayhome:nowayhome@127.0.0.1:5433/nowayhome_test?schema=public
        run: |
          pnpm --filter backend run test:e2e:prepare
          pnpm --filter backend run test:e2e
      - run: npm ci --prefix mobile-app --ignore-scripts
      - run: npm run lint --prefix mobile-app
      - run: npm run typecheck --prefix mobile-app
